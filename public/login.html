<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechShelf | Sign In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <div class="brand dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>Tech<span class="shelf">Shelf</span></span>
        </div>
        <p>Sign in to your account</p>
      </div>

      <!-- Milestone 2: action will POST to the back-end auth API -->
      <form action="#" method="post">
        <div class="field">
          <label for="identifier">Username or Email</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            <input type="text" id="identifier" name="identifier" placeholder="Enter your username or email" required autocomplete="username">
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
          </div>
        </div>

        <div class="row-between">
          <label><input type="checkbox" name="remember"> Remember me</label>
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-primary">Log In</button>
      </form>

      <div class="auth-foot">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </main>

  <footer class="footer light">
    <span>&copy; 2026 TechShelf. All rights reserved.</span>
  </footer>

</body>
</html>
