<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechShelf | Create Account</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="auth-wrap">
    <div class="auth-card wide">
      <div class="auth-head">
        <div class="brand dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>Tech<span class="shelf">Shelf</span></span>
        </div>
        <p>Create a new account</p>
      </div>

      <!-- Milestone 2: action will POST to the back-end registration API -->
      <form action="#" method="post">
        <div class="form-grid">
          <div>
            <div class="field">
              <label for="fullname">Full Name</label>
              <div class="input-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required autocomplete="name">
              </div>
            </div>

            <div class="field">
              <label for="email">Email Address</label>
              <div class="input-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
                <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
              </div>
            </div>

            <div class="field">
              <label for="username">Username</label>
              <div class="input-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                <input type="text" id="username" name="username" placeholder="Choose a username" required minlength="3" autocomplete="username">
              </div>
            </div>
          </div>

          <div>
            <div class="field">
              <label for="password">Password</label>
              <div class="input-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                <input type="password" id="password" name="password" placeholder="Create a password" required minlength="8" autocomplete="new-password">
              </div>
            </div>

            <div class="field">
              <label for="confirm">Confirm Password</label>
              <div class="input-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                <input type="password" id="confirm" name="confirm" placeholder="Confirm your password" required minlength="8" autocomplete="new-password">
              </div>
            </div>

            <div class="notice">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
              You will need to verify your email before your account is activated.
            </div>
          </div>
        </div>

        <button type="submit" class="btn-primary">Create Account</button>
      </form>

      <div class="auth-foot">
        Already have an account? <a href="login.html">Log in here</a>
      </div>
    </div>
  </main>

  <footer class="footer light">
    <span>&copy; 2026 TechShelf. All rights reserved.</span>
  </footer>

</body>
</html>
